# SSH for on-device debugging.
#
# Two things have to be overridden for this image:
#
#  * Host keys live on /data, not /etc/ssh. The root filesystem is a read-only
#    SquashFS, so sshd cannot generate its keys at first boot — that is why SSH
#    accepted no connections at all: the service started, then failed with
#    "sshd: no hostkeys available".
#
#  * Root login with a password is permitted. Debian defaults to
#    prohibit-password, which locks out the only account this appliance has.
#    This is deliberate and LAN-only: the firewall accepts tcp/22 from the LAN
#    zone and drops it from WAN, so it is not reachable from the internet.
#    Anyone on the LAN who knows the root password gets a root shell — set a
#    strong one, or replace this with an authorized_keys file and turn
#    PasswordAuthentication back off.

HostKey /data/sbegw/ssh/ssh_host_ed25519_key
HostKey /data/sbegw/ssh/ssh_host_rsa_key

PermitRootLogin yes
PasswordAuthentication yes
PubkeyAuthentication yes

# Keep a debugging session alive across a Wi-Fi reconfiguration that briefly
# interrupts the path.
ClientAliveInterval 30
ClientAliveCountMax 10
