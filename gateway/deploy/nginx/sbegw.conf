# nginx front end for the sbegw control plane.
#
# nginx terminates TLS and serves the static UI; the API itself only listens on
# 127.0.0.1:8081 so it is never reachable without passing through here.

upstream sbegw_api {
    server 127.0.0.1:8081 fail_timeout=2s;
    keepalive 4;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Local management must keep working when there is no certificate trust
    # path, so http is redirected rather than refused.
    location / { return 301 https://$host$request_uri; }
}

server {
    # Debian bookworm ships nginx 1.22, where HTTP/2 is a listen parameter.
    # The separate `http2 on;` directive only exists from 1.25.1 and made the
    # config fail to parse ("unknown directive"), so nginx never started.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /data/sbegw/tls/server.crt;
    ssl_certificate_key /data/sbegw/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:sbegw:2m;
    ssl_session_timeout 1h;

    root /opt/sbegw/web;
    index index.html;

    client_max_body_size 8m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # The UI is entirely self-contained: no external origin is ever needed.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    # Server-sent events: buffering must be off or live telemetry arrives in
    # bursts minutes apart.
    location = /api/v1/stream {
        proxy_pass http://sbegw_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://sbegw_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Fonts are content-stable, so they may be cached hard.
    location ~* \.(woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # The UI must not be served from cache after a firmware update, or the
    # browser keeps running the previous release's JavaScript against the new
    # API. must-revalidate still allows a 304, so this is cheap.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
