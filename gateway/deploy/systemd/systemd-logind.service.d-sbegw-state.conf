# systemd-logind failed on every boot with
#   Failed to set up special execution directory in /var/lib: Read-only file system
#   Failed at step STATE_DIRECTORY
# because the root filesystem is a read-only SquashFS and the unit declares
# StateDirectory=systemd/linger. Lingering lets a user's services keep running
# after logout, which is meaningless on a gateway appliance, so the directory
# requirement is dropped rather than carving out writable space for it.
#
# An empty assignment clears the inherited list.
[Service]
StateDirectory=
