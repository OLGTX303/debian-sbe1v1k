# Extract the ath12k calibration blobs as part of ART init rather than from a
# unit of our own.
#
# A separate service could not be ordered correctly: it needs to run before
# wififw/systemd-modules-load, but a normal unit also gets an implicit
# After=basic.target, and basic.target -> sysinit -> modules-load -> wififw ->
# us -> basic.target is a cycle. systemd broke it by deleting the
# systemd-modules-load job entirely. sbe1v1k-art-init already carries exactly the
# right ordering (DefaultDependencies=no, Before=wififw systemd-modules-load,
# WantedBy=sysinit.target), so hanging the extraction off it adds no new edges.
[Service]
ExecStartPost=/opt/sbegw/bin/sbegw-art-caldata
