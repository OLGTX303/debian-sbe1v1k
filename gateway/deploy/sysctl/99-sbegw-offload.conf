# Stop Qualcomm ECM's accelerated forwarding front ends.
#
# ECM offloads forwarded flows to the NSS/PPE hardware path. Measured on this
# board it breaks forwarding for LAN clients outright: the client's SYN leaves,
# conntrack shows the flow reaching ESTABLISHED/ASSURED in both directions, and
# the client still receives nothing — every request times out having read 0
# bytes. The gateway's own traffic is unaffected, which is why the router looked
# online while every Wi-Fi and wired client had no internet.
#
# Stopping the front ends fixes it immediately and reproducibly: http=000 after
# 9s becomes http=301 in 0.7s. None of the narrower knobs help — src_interface_
# check, ppe_fse_enable, sfe_fse_enable and sfe_fast_xmit_enable were each
# tested alone and changed nothing.
#
# This file is best-effort: the ECM modules may not be loaded when
# systemd-sysctl runs, in which case these keys do not exist yet. netd applies
# the same setting on every configuration apply, which is the authoritative
# path, and it is driven by firewall.hardware_offload.
net.ecm.front_end_ipv4_stop = 1
net.ecm.front_end_ipv6_stop = 1
