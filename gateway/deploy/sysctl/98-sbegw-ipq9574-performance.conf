# IPQ9574 / IPQ9570-family production datapath sizing.
#
# These values are taken from the supplied UCGF IPQ9574 rootfs rather than
# generic desktop tuning. They size the Linux side for the board's 10 GbE WAN;
# PPE/ECM-offloaded flows use hardware queues, while exceptions and DPI's
# initial observation window still need enough host socket/backlog capacity.
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 87380 134217728
net.core.netdev_max_backlog = 100000
net.core.optmem_max = 3145728

# Match the vendor's bounded conntrack sizing for a 1 GiB appliance. Larger
# tables consume unreclaimable kernel memory and reduce failure headroom.
net.netfilter.nf_conntrack_max = 131072
net.netfilter.nf_conntrack_buckets = 32768
net.netfilter.nf_conntrack_tcp_be_liberal = 1
