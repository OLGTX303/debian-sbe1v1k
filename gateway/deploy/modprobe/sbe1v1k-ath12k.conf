# Group all three radios behind one wiphy, which is what MLO needs.
#
# ath12k has two layouts (ath12k_mac_allocate):
#
#   mlo_capable=1 (its default) groups every radio of the hardware group behind
#     ONE wiphy so MLO links can share it. That wiphy advertises "#channels <= 1"
#     — but the driver does not enforce it. Measured on this board: three
#     independent BSSes on 2437 / 5180 / 6135 MHz all reach ENABLED together,
#     and so does a 2-link MLD (5 GHz + 6 GHz) alongside a plain 2.4 GHz BSS.
#
#   mlo_capable=0 registers one wiphy per radio — phy00 (2.4), phy01 (5) and
#     phy03 (6 GHz). Concurrent tri-band works, but MLO cannot: multi-link
#     association requires the links to share a wiphy.
#
# So mode 1 is a superset here and mode 0 buys nothing. The earlier failure that
# drove mlo_capable=0 ("Could not set interface wl5g0 flags (UP)") was not the
# channel limit at all — it was hostapd being handed a per-link interface name
# per MLD link. hostapd identifies an AP MLD by its interface name, so the links
# have to share one netdev; wifid now plans them that way.
options ath12k mlo_capable=1
