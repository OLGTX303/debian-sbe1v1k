# Config file for ipq95xx systems

# Each heading starts a new configuration
# Heading should be in format "[HEADING_NAME]"
# Parsing starts after heading, stops after an empty line

# Configuration for txdesc_ring to fc_group (VQ) mapping
# Assign VQs manually to txdesc rings
[txdesc_fc_mapping]
# <TX_DESC_ID>=<VQ_NUM>

# Installed from the QSDK reference rootfs. Its absence made edma_of_get_pdata
# log an error and fall back to defaults on every boot:
#   edma_parse_ring_fc_mapping: Error in reading config file.
#   edma_of_get_pdata: Error in reading user-defined fc group mapping from
#                      /etc/config/nss_cfg.ini.. Taking default config.
# The vendor file declares no explicit txdesc->VQ mapping either, so the
# resulting queue configuration is unchanged — this removes a spurious boot
# error and matches the reference platform, nothing more.
