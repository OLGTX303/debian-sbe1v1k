# The rootfs nginx.conf logs to /run/nginx, but nothing created that directory,
# so nginx failed at ExecStartPre on every boot with
#   open() "/run/nginx/error.log" failed (2: No such file or directory)
# tmpfiles runs during sysinit, well before nginx.
d /run/nginx 0755 www-data www-data -
d /run/sbegw 0755 root root -
d /run/sbegw/hostapd 0755 root root -
d /run/firmware 0755 root root -

# The QSDK hostapd's async socket layer (CONFIG_QCN_EXTN) binds a HARDCODED
# unix socket at /var/run/hostapd/hostapd_if_eloop — the path is compiled in,
# not configurable. On Debian /var/run is a symlink to /run, and /run/hostapd
# does not exist, so bind() returned ENOENT and hostapd aborted with
#   hostapd_if: Failed to bind server socket: No such file or directory
#   Failed to init action frame registry
# before it even parsed the configuration.
d /run/hostapd 0755 root root -

# /etc is on the read-only SquashFS, so dhclient-script could not write
# resolv.conf: make_resolv_conf() does
#     resolv_conf=$(readlink -f /etc/resolv.conf)
#     new_resolv_conf="${resolv_conf}.dhclient-new.$$"
# and creating that temp file in /etc fails. dhclient treats the script's
# non-zero exit as a bad lease and sends DHCPDECLINE — so every offer was
# accepted then immediately refused, the WAN never settled, and eth3
# accumulated one stale address per cycle (88 of them in twenty minutes).
#
# With /etc/resolv.conf symlinked to /run/resolv.conf, readlink -f resolves
# into tmpfs and the temp file is writable. Seed it so name resolution works
# before the first lease arrives.
f /run/resolv.conf 0644 root root - nameserver\x201.1.1.1\nnameserver\x208.8.8.8\n
